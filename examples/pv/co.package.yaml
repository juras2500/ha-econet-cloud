      - condition: template
        value_template: '{{ next_action == "restore" }}'
      sequence:
      - condition: template
        value_template: |-
          {% set timestamp = as_timestamp(now()) %}
          {% set day = now().strftime('%Y-%m-%d') %}
          {% set raw_session = states('input_text.example_pv_co_session') | from_json(none) %}
