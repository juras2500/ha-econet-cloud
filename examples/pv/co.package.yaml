  - choose:
    - alias: Zachowaj ręczną nastawę
      conditions:
      - condition: template
        value_template: '{{ next_action == "forget" }}'
      sequence:
      - action: input_text.set_value
        target:
          entity_id: input_text.example_pv_co_session
        data:
          value: '{{ {"day": session_day} | to_json }}'
    - alias: Przywróć nastawę Komfort
